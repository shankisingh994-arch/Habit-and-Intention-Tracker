services:
  api:
    build: ./backend
    container_name: my-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  ui:
    build: ./frontend
    container_name: my-ui
    ports:
      - "3000:5173" # dev me 5173, nginx me 80
    depends_on:
      - api
    restart: unless-stopped